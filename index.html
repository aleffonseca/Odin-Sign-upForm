<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="column-one">
        <div class="logo-and-brand">
                <img class="logo" src="images/odin-lined.png" alt="">
                <span>ODIN</span> 
        </div>
    </div>
    <div class="column-two">
        <div class="title">
            <h2>
                We want to get to know you better!
            </h2>
            <h2>
                Fill out the form below to access our services:
            </h2>
        </div>
        <div class="form">
            <form action="" method="get" class="signUp-form">
                <div class="form-column-one">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="userFistName">
                    
                    <label for="user-email">EMAIL</label>
                    <input type="email" id="user-email" name="userEmail" required placeholder="Ex.: useremail@email.com">

                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="userPassword" required minlength="8">

                </div>
                
                <div class="form-column-two">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="userLastName">
                    
                    <label for="phone">PHONE NUMBER</label>
                    <input type="text" id="phone" name="userPhone" placeholder="Ex.: +12 (086) 73654-2816">
    
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" name="userConfirmPassword" required minlength="8">

                </div>
            </form>
        </div>
        <div class="form-footer">
            <button type="submit">Create Account</button>
            <br>
            <br>
            <p>If you already have an account: <a href="">Log in here</a></p>
        </div>

    </div>
</body>
</html>
